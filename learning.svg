<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>Learning &amp; development</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.title{fill:#f5f5f5;font-size:28px;font-weight:700}
.label{fill:#969696;font-size:12px;letter-spacing:2px}
.body{fill:#c9c9c9;font-size:18px}
.small{fill:#a5a5a5;font-size:15px}
.card-title{fill:#f0f0f0;font-size:21px;font-weight:600}
.enter{animation:reveal 1.3s ease-out both}
.delay{animation-delay:.2s}
.pulse{animation:pulse 4s ease-in-out infinite}
.travel{animation:travel 9s ease-in-out infinite}
.cursor{animation:blink 1.4s step-end infinite}
@keyframes reveal{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(790px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.enter,.pulse,.travel,.cursor{animation:none}}
</style><rect x="1" y="1" width="998" height="478" rx="18" fill="#0e0e0e" stroke="#333"/><path d="M36 96H964" stroke="#292929"/><rect x="36" y="95" width="130" height="2" fill="#a5a5a5" class="travel"/><text x="36" y="32" class="label">04 / NEXT STEPS</text><text x="36" y="72" class="title">Learning &amp; development</text><circle cx="959" cy="47" r="5" fill="#eee" class="pulse"/><circle cx="44" cy="133" r="5" fill="#bcbcbc" class="pulse"/><text x="64" y="140" class="card-title">Data &amp; analytics</text><text x="64" y="170" class="small">Strengthening Python, SQL, and Power BI to communicate clear insights.</text><circle cx="44" cy="221" r="5" fill="#bcbcbc" class="pulse"/><text x="64" y="228" class="card-title">Artificial intelligence</text><text x="64" y="258" class="small">Exploring tool use, memory, and practical workflows in AI agents.</text><circle cx="44" cy="309" r="5" fill="#bcbcbc" class="pulse"/><text x="64" y="316" class="card-title">Software engineering</text><text x="64" y="346" class="small">Improving API design, database modeling, validation, and maintainability.</text><path d="M36 378H964" stroke="#333"/><text x="36" y="414" class="label">LET’S CONNECT</text><text x="36" y="450" class="body">Explore my portfolio or connect with me on LinkedIn.</text><rect x="493" y="435" width="7" height="17" fill="#ccc" class="cursor"/></svg>