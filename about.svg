<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="393" viewBox="0 0 1000 393" role="img"><title>About me</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.title{fill:#f5f5f5;font-size:28px;font-weight:700}
.label{fill:#969696;font-size:12px;letter-spacing:2px}
.body{fill:#c9c9c9;font-size:18px}
.small{fill:#a5a5a5;font-size:15px}
.card-title{fill:#f0f0f0;font-size:21px;font-weight:600}
.enter{animation:reveal 1.3s ease-out both}
.delay{animation-delay:.2s}
.pulse{animation:pulse 4s ease-in-out infinite}
.travel{animation:travel 9s ease-in-out infinite}
.cursor{animation:blink 1.4s step-end infinite}
@keyframes reveal{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(790px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.enter,.pulse,.travel,.cursor{animation:none}}
</style><rect x="1" y="1" width="998" height="391" rx="18" fill="#0e0e0e" stroke="#333"/><path d="M36 96H964" stroke="#292929"/><rect x="36" y="95" width="130" height="2" fill="#a5a5a5" class="travel"/><text x="36" y="32" class="label">01 / INTRODUCTION</text><text x="36" y="72" class="title">About me</text><circle cx="959" cy="47" r="5" fill="#eee" class="pulse"/><g class="enter"><text x="36" y="139" class="card-title">Curiosity, code, and a creative perspective.</text><text x="36" y="178" class="body">I’m Gaveshika Nirmani, a Data Science undergraduate at SLTC, Sri Lanka.</text><text x="36" y="207" class="body">I learn through hands-on projects in AI, analytics, and software development.</text><text x="36" y="236" class="body">My work spans REST APIs, desktop applications, and AI assistants.</text></g><g class="enter delay"><rect x="36" y="277" width="292" height="88" rx="10" fill="#191919" stroke="#303030"/><text x="53" y="305" class="label">ACADEMIC FOCUS</text><text x="53" y="337" class="body">Data Science</text><rect x="354" y="277" width="292" height="88" rx="10" fill="#191919" stroke="#303030"/><text x="371" y="305" class="label">EXPLORING</text><text x="371" y="337" class="body">AI agents &amp; analytics</text><rect x="672" y="277" width="292" height="88" rx="10" fill="#191919" stroke="#303030"/><text x="689" y="305" class="label">CREATIVE INTEREST</text><text x="689" y="337" class="body">Design &amp; communication</text></g></svg>