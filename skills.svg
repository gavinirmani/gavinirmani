<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="414" viewBox="0 0 1000 414" role="img"><title>Technology stack</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.title{fill:#f5f5f5;font-size:28px;font-weight:700}
.label{fill:#969696;font-size:12px;letter-spacing:2px}
.body{fill:#c9c9c9;font-size:18px}
.small{fill:#a5a5a5;font-size:15px}
.card-title{fill:#f0f0f0;font-size:21px;font-weight:600}
.enter{animation:reveal 1.3s ease-out both}
.delay{animation-delay:.2s}
.pulse{animation:pulse 4s ease-in-out infinite}
.travel{animation:travel 9s ease-in-out infinite}
.cursor{animation:blink 1.4s step-end infinite}
@keyframes reveal{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(790px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.enter,.pulse,.travel,.cursor{animation:none}}
